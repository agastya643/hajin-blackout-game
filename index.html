function reload(){if(phase!=='playing'||reloading||mag===30||reserve<=0)return;reloading=true;reloadStarted=performance.now();tone(260,.09,'square',.025,180);hud();setTimeout(()=>{if(phase!=='playing')return;const n=Math.min(30-mag,reserve);mag+=n;reserve-=n;reloading=false;tone(520,.08,'square',.025,700);hud();say('RELOADED',1)},1100)}
function fire(){if(!controls.isLocked||phase!=='playing'||reloading)return;const now=performance.now();if(now-lastShot<145)return;lastShot=now;if(!mag){say('PRESS R TO RELOAD',.8);tone(150,.05,'square',.02);return}mag--;gunKick=Math.min(gunKick+.16,.32);muzzleTimer=.055;shotSound();hud();ray.setFromCamera(new THREE.Vector2(0,0),camera);const candidates=enemies.filter(e=>e.userData.alive);if(enemies.every(e=>!e.userData.alive)&&truck&&!truck.userData.dead)candidates.push(truck);const hits=ray.intersectObjects(candidates,true);if(!hits.length||hits[0].distance>65)return;const hit=hits[0].object,enemy=hit.userData.enemy,tr=hit.userData.truck;if(enemy?.userData.alive){enemy.userData.hp-=enemy.userData.boss?50:100;if(enemy.userData.hp<=0)killEnemy(enemy);else say('HIT',.5)}else if(tr){tr.userData.hp-=25;if(tr.userData.hp<=0){tr.userData.dead=true;tr.visible=false;say('FUEL TRUCK DESTROYED')}}hud()}
let reloadStarted=0;function killEnemy(e){e.userData.alive=false;e.userData.fall=0;for(const p of e.userData.parts){p.userData.velocity=new THREE.Vector3((Math.random()-.5)*2,1+Math.random()*2,(Math.random()-.5)*2)}say(e.userData.boss?'VOLKOV HIT':'HOSTILE DOWN')}
function hurt(n){if(phase!=='playing')return;health-=n;ui.hurt.style.opacity=1;setTimeout(()=>ui.hurt.style.opacity=0,180);hud();if(health<=0){phase='dead';controls.unlock();show('Squad Down',missions[index].name,'You were overwhelmed. Retry the mission and use cover, sprint, and reload between engagements.','RETRY',()=>{buildMap();controls.lock()})}}
function enemyAI(dt){if(phase!=='playing')return;for(const e of enemies){if(!e.userData.alive){e.userData.fall+=dt;for(const p of e.userData.parts){p.position.y=Math.max(-.35,p.position.y-dt*1.4);if(p.userData.velocity){p.position.addScaledVector(p.userData.velocity,dt);p.userData.velocity.y-=5*dt;p.userData.velocity.multiplyScalar(.94)}}e.rotation.z=Math.min(1.2,e.userData.fall*1.7);continue}const dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,d=Math.hypot(dx,dz);e.rotation.y=Math.atan2(dx,dz);if(d>5.5){e.position.x+=dx/d*e.userData.speed*dt;e.position.z+=dz/d*e.userData.speed*dt;e.userData.walk+=dt*8;const swing=Math.sin(e.userData.walk)*.55;e.userData.limbs[2].rotation.x=swing;e.userData.limbs[3].rotation.x=-swing;e.userData.limbs[0].rotation.x=-swing*.65;e.userData.limbs[1].rotation.x=swing*.65}else{e.userData.limbs[2].rotation.x=0;e.userData.limbs[3].rotation.x=0}e.userData.cool-=dt;if(d<24&&e.userData.cool<=0){e.userData.cool=1.25+Math.random();if(Math.random()<.32){hurt(e.userData.boss?12:7);tone(90,.1,'sawtooth',.014,55)}}}}
function objectives(){if(phase!=='playing')return;const clear=enemies.every(e=>!e.userData.alive);if(index===0&&clear&&truck&&!truck.userData.dead)ui.objective.textContent='Stadium cleared. Shoot the fuel truck to seal the breach.';if(index===0&&truck?.userData.dead){finish();return}if(index!==0&&clear){ui.objective.textContent='Area clear. Reach the glowing route marker.';if(Math.hypot(camera.position.x-exit.x,camera.position.z-exit.z)<3.2)finish()}}
// Camera-mounted rifle: movement bob, aim sway, muzzle flash, kick, and reload pose.
const gun=new THREE.Group(),baseGunPos=new THREE.Vector3(.36,-.31,-.62);const gunBody=new THREE.Mesh(new THREE.BoxGeometry(.2,.2,.65),new THREE.MeshStandardMaterial({color:0x242a2e,metalness:.55,roughness:.45}));gunBody.position.set(0,0,0);gun.add(gunBody);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.42,10),new THREE.MeshStandardMaterial({color:0x101417,metalness:.65}));barrel.rotation.x=Math.PI/2;barrel.position.set(0,.02,-.43);gun.add(barrel);const flash=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0xffce62}));flash.position.set(0,.02,-.68);flash.visible=false;gun.add(flash);camera.add(gun);scene.add(camera);
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousedown',e=>{if(e.button===0)fire()});controls.addEventListener('unlock',()=>{if(phase==='playing')show('Paused',missions[index].name,'Mission paused. Resume when you are ready.','RESUME',()=>controls.lock())});
function move(dt){if(!controls.isLocked||phase!=='playing')return;const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),n=Math.hypot(f,s)||1,sprint=keys.ShiftLeft||keys.ShiftRight,speed=sprint?7.4:4.7;moveAmount=THREE.MathUtils.damp(moveAmount,(f||s)?1:0,8,dt);controls.moveForward(f/n*speed*dt);controls.moveRight(s/n*speed*dt);camera.position.y=1.7+Math.sin(performance.now()*.012)*.025*moveAmount;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-6,6);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-69,17);for(const b of obstacles){if(Math.abs(camera.position.x-b.x)<b.w/2+.4&&Math.abs(camera.position.z-b.z)<b.d/2+.4){controls.moveForward(-f/n*speed*dt);controls.moveRight(-s/n*speed*dt);break}}const t=performance.now()*.001;const reloadBlend=reloading?Math.sin(Math.min(1,(performance.now()-reloadStarted)/1100)*Math.PI):0;gun.position.set(baseGunPos.x+Math.sin(t*5)*.012*moveAmount,baseGunPos.y+Math.abs(Math.sin(t*8))*.018*moveAmount-reloadBlend*.42-gunKick*.7,baseGunPos.z+gunKick*.8);gun.rotation.x=reloadBlend*.8-gunKick*.55;gun.rotation.z=Math.sin(t*4)*.018*moveAmount+reloadBlend*.24;gunKick*=Math.pow(.001,dt);if(muzzleTimer>0){muzzleTimer-=dt;flash.visible=muzzleTimer>0}else flash.visible=false}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);move(dt);enemyAI(dt);objectives();if(toastTime>0&&((toastTime-=dt)<=0))ui.toast.textContent='';renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});briefing();loop();
